# Publishes @askmorse/verify to npm from each v* tag, through trusted publishing with no stored
# token. It runs only once the NPM_PUBLISH variable is true.
# The github-release job then creates the tag's GitHub Release, saying what changed.

name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  npm:
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    # npm's trusted publisher names this environment, which allows v* tags alone, so a run from a
    # branch, or from a tag no one may create, can't publish.
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.published.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: new
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a vYYYY.M.N release"; exit 1; }
          publish=true
          for other in $(git tag --points-at HEAD | grep -vxF "$TAG" || true); do
            [[ $other =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            if [ -n "$(npm view "@askmorse/verify@${other#v}" version 2>/dev/null)" ]; then
              echo "::notice::npm has this commit as ${other#v}, from $other; $TAG publishes nothing"
              publish=false
              break
            fi
          done
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
      - if: steps.new.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - if: steps.new.outputs.publish == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test && npm run build
      - if: steps.new.outputs.publish == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: npm version --no-git-tag-version "${TAG#v}"
      - name: Pack it, install the tarball, and run its CLI
        if: steps.new.outputs.publish == 'true'
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/try"
          cd "$RUNNER_TEMP/try"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/askmorse-verify-*.tgz
          npx --no -- trymorse-verify --version
          npx --no -- trymorse-verify --help
      - if: steps.new.outputs.publish == 'true'
        run: npm publish --ignore-scripts
      - id: published
        if: steps.new.outputs.publish == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

  # One GitHub Release per tag, after npm has the version it names. A tag whose npm job is off or
  # publishes nothing still gets its Release, and a rerun leaves an existing Release alone.
  github-release:
    needs: [npm]
    if: ${{ !cancelled() && needs.npm.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NPM_VERSION: ${{ needs.npm.outputs.published }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG already has a Release"
            exit 0
          fi
          .github/scripts/release-notes.sh "$TAG" ${NPM_VERSION:+"$NPM_VERSION"} >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
